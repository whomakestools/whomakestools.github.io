<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Who Makes Tools | Listas</title>
  <link rel="stylesheet" href="./css/lista.css">
</head>
<body>
  <header class="topbar">
    <h1>Listas</h1>
    <button class="btn primary" data-action="nova-lista">+ Nova lista</button>
  </header>

  <main id="geral" class="geral"></main>

  <!-- Nome de lista / grupo -->
  <div class="sheet" id="sheetNome" hidden>
    <form class="card" id="formNome">
      <h2 id="nomeTitulo"></h2>
      <label>Descrição
        <input type="text" id="nomeInput" maxlength="80" autocomplete="off" required>
      </label>
      <div class="acoes">
        <button type="button" class="btn" data-action="fechar">Cancelar</button>
        <button class="btn primary">Salvar</button>
      </div>
    </form>
  </div>

  <!-- Item -->
  <div class="sheet" id="sheetItem" hidden>
    <form class="card" id="formItem">
      <h2 id="itemTitulo"></h2>
      <label>Descrição
        <input type="text" id="iDesc" maxlength="120" autocomplete="off" placeholder="Descrição do item" required>
      </label>
      <div class="linha">
        <label>Unidade
          <select id="iUn">
            <option>UN</option><option>KG</option><option>LT</option><option>PÇ</option>
            <option>PC</option><option>DZ</option><option>CX</option>
          </select>
        </label>
        <label>Quantidade
          <input type="number" id="iQtd" inputmode="decimal" step="any" min="0">
        </label>
      </div>
      <label>Preço
        <div class="preco-wrap">
          <input type="number" id="iPreco" inputmode="decimal" step="0.01" min="0" placeholder="0,00">
          <button type="button" class="btn" id="btnCam" data-action="camera" title="Ler preço pela câmera" aria-label="Ler preço pela câmera">📷</button>
        </div>
      </label>
      <div class="prev" id="prev"></div>
      <div class="acoes">
        <button type="button" class="btn" data-action="fechar">Cancelar</button>
        <button class="btn primary">Salvar</button>
      </div>
    </form>
  </div>

  <script src="https://whomakestools.github.io/leitor/price-scanner.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
