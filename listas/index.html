<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#5b4bd6">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>Who Makes Tools | Listas</title>
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('listas-tema') || 'dark' } catch (e) { document.documentElement.dataset.theme = 'dark' } // padrão: modo escuro
  </script>
  <link rel="stylesheet" href="./css/lista.css?v=13">
</head>
<body>
  <header class="topbar">
    <h1>
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5.5 10.5 9 4M18.5 10.5 15 4M2.5 10.5h19L19.7 19a2 2 0 0 1-2 1.5H6.3a2 2 0 0 1-2-1.5zM9 14v3M12 14v3M15 14v3"/>
      </svg>
      Listas
    </h1>
    <div class="topo-acoes">
      <button type="button" class="icon" id="btnTema" data-action="tema" title="Modo escuro" aria-label="Alternar modo escuro"></button>
      <button type="button" class="icon" data-action="importar" title="Importar lista (QR Code)" aria-label="Importar lista por QR Code"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></svg></button>
      <button class="btn primary" data-action="nova-lista">+ Nova lista</button>
    </div>
    <input type="search" id="filtro" class="filtro" placeholder="Filtrar listas pelo nome…" autocomplete="off" aria-label="Filtrar">
  </header>

  <main id="geral" class="geral"></main>

  <!-- Nome de lista / grupo -->
  <div class="sheet" id="sheetNome" hidden>
    <form class="card" id="formNome">
      <h2 id="nomeTitulo"></h2>
      <label>Descrição
        <input type="text" id="nomeInput" maxlength="80" autocomplete="off" required>
      </label>
      <label class="chk" id="chkGrupos" hidden>
        <input type="checkbox" id="usarGrupos"> Organizar a lista em grupos
      </label>
      <div class="acoes">
        <button type="button" class="btn" data-action="fechar">Cancelar</button>
        <button class="btn primary">Salvar</button>
      </div>
    </form>
  </div>

  <!-- Item -->
  <div class="sheet" id="sheetItem" hidden>
    <form class="card" id="formItem">
      <h2 id="itemTitulo"></h2>
      <label>Descrição
        <input type="text" id="iDesc" maxlength="120" autocomplete="off" placeholder="Descrição do item" required>
      </label>
      <div class="linha">
        <label>Unidade
          <select id="iUn">
            <option>UN</option><option>KG</option><option>LT</option><option>PÇ</option>
            <option>PC</option><option>DZ</option><option>CX</option>
          </select>
        </label>
        <label>Quantidade
          <input type="number" id="iQtd" inputmode="decimal" step="any" min="0">
        </label>
      </div>
      <label>Preço
        <div class="preco-wrap">
          <input type="text" id="iPreco" inputmode="numeric" autocomplete="off" placeholder="0,00">
          <button type="button" class="btn" id="btnCam" data-action="camera" title="Ler preço pela câmera" aria-label="Ler preço pela câmera">📷</button>
        </div>
      </label>
      <div class="prev" id="prev"></div>
      <div class="acoes">
        <button type="button" class="btn" data-action="fechar">Cancelar</button>
        <button class="btn primary">Salvar</button>
      </div>
    </form>
  </div>

  <!-- Compartilhar lista (QR Code) -->
  <div class="sheet" id="sheetQR" hidden>
    <div class="card qr">
      <h2 id="qrTitulo">Compartilhar lista</h2>
      <div id="qrBox" class="qr-box" title="Toque para ampliar"><canvas id="qrCanvas"></canvas></div>
      <p id="qrInfo" class="dica"></p>
      <div class="acoes"><button type="button" class="btn" data-action="fechar">Fechar</button></div>
    </div>
  </div>

  <!-- Importar lista (ler QR Code) -->
  <div class="sheet" id="sheetScan" hidden>
    <div class="card qr">
      <h2>Importar lista</h2>
      <video id="scanVideo" class="scan-video" playsinline muted></video>
      <p id="scanMsg" class="dica"></p>
      <div class="acoes"><button type="button" class="btn" data-action="fechar">Cancelar</button></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <!-- Valor para gastar -->
  <div class="sheet" id="sheetOrc" hidden>
    <form class="card" id="formOrc">
      <h2>Valor para gastar</h2>
      <label>Valor (R$)
        <input type="text" id="oVal" inputmode="numeric" autocomplete="off" placeholder="0,00">
      </label>
      <p class="dica">Deixe em branco ou 0 para remover.</p>
      <div class="acoes">
        <button type="button" class="btn" data-action="fechar">Cancelar</button>
        <button class="btn primary">Salvar</button>
      </div>
    </form>
  </div>

  <!-- Confirmação -->
  <div class="sheet" id="sheetConfirm" hidden>
    <div class="card" role="alertdialog" aria-labelledby="confTitulo">
      <h2 id="confTitulo">Confirmar</h2>
      <p id="confMsg"></p>
      <div class="acoes">
        <button type="button" class="btn" data-action="conf-nao">Cancelar</button>
        <button type="button" class="btn danger" id="confSim" data-action="conf-sim">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- Resumo da lista -->
  <div class="sheet" id="sheetResumo" hidden>
    <div class="card">
      <h2>Resumo da lista</h2>
      <pre id="resumoTexto" class="resumo"></pre>
      <div class="acoes">
        <button type="button" class="btn" data-action="fechar">Fechar</button>
        <button type="button" class="btn primary" id="btnCopiar" data-action="copiar">Copiar</button>
      </div>
    </div>
  </div>

  <script>
    // funcionar offline (precisa de HTTPS ou localhost)
    if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}))
  </script>
  <script src="https://whomakestools.github.io/leitor/price-scanner.js"></script>
  <script src="./js/app.js?v=13"></script>
</body>
</html>
