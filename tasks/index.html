<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de Atividades</title>
<script>try{var t=localStorage.getItem('controle-atividades-v1-tema');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f3f4f7;--panel:#fff;--ink:#1c2230;--mute:#667085;--line:#dde1ea;--acc:#2f4bd6;--accbg:#e8ecfd;--onacc:#fff;--bad:#c23b3b;--bar:#e3e7f0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--panel:#1a1f2a;--ink:#e6e9f1;--mute:#9099ad;--line:#2b3242;--acc:#7b92ff;--accbg:#232c4d;--onacc:#10142a;--bad:#ef7676;--bar:#2b3242}}
:root[data-theme="dark"]{--bg:#12151c;--panel:#1a1f2a;--ink:#e6e9f1;--mute:#9099ad;--line:#2b3242;--acc:#7b92ff;--accbg:#232c4d;--onacc:#10142a;--bad:#ef7676;--bar:#2b3242}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px}
aside h1{font-size:16px;margin:0;font-weight:600}
.plist{display:flex;flex-direction:column;gap:4px}
.pitem{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px 10px;color:var(--ink);cursor:pointer;font:inherit}
.pitem:hover{background:var(--bg)}
.pitem.on{background:var(--accbg);font-weight:600}
.pitem small{display:block;color:var(--mute);font-weight:400}
main{padding:20px;max-width:1000px;width:100%}
input,button,textarea{font:inherit;color:var(--ink)}
input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{cursor:pointer}
.btn{background:var(--acc);color:var(--onacc);border:0;border-radius:6px;padding:7px 12px;font-weight:500}
.btn.del{background:var(--bad);color:#fff}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 9px;color:var(--mute)}
.ghost:hover{color:var(--ink);border-color:var(--mute)}
.ghost.d:hover{color:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.app.noside{grid-template-columns:1fr}.app.noside aside{display:none}.app.noside main{max-width:1260px;margin:0 auto}
.ib{display:inline-grid;place-items:center;width:32px;height:32px;padding:0;border:0;border-radius:8px;background:none;color:var(--mute);flex:none;transition:background .15s,color .15s}.ib:hover{background:var(--bg);color:var(--ink)}main .ib:hover{background:var(--panel)}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ahead{display:flex;align-items:center;gap:2px}.net{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);padding:6px 10px;border:1px dashed var(--line);border-radius:8px}.net[hidden]{display:none}.net i{width:8px;height:8px;border-radius:50%;background:#f59e0b;flex:none}
.ahead{margin-right:-6px}.ahead h1{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk{display:flex;align-items:flex-start;gap:8px;cursor:pointer;font-size:13px}.chk input{width:auto;margin:2px 0 0;flex:none}
h2{font-size:22px;font-weight:600;margin:0}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0 20px}
.sum>div,.act{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.sum>div{padding:12px}
.sum span{display:block;color:var(--mute);font-size:12px}
.sum b{font-size:20px;font-weight:600}
.bar{height:8px;background:var(--bar);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.over{color:var(--bad)!important}
.act{margin-bottom:10px;overflow:hidden}
.th{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:12px 14px;text-align:left;flex-wrap:wrap}
.th:hover{background:var(--bg)}
.chev{display:inline-block;width:14px;color:var(--mute);transition:transform .15s}
.open>.th .chev,.sub.open>.th .chev{transform:rotate(90deg)}
.nm{font-weight:600;flex:1 1 160px}
.st{color:var(--mute);font-size:13px}
.mini{width:90px}
.body{padding:2px 14px 14px 38px;border-top:1px solid var(--line)}
.sec{display:flex;align-items:center;gap:8px;margin:14px 0 6px}
.sec h3{margin:0;font-size:13px;color:var(--mute);font-weight:600;flex:1}
ul{list-style:none;margin:0;padding:0}
.sub{border:1px solid var(--line);border-radius:6px;margin-bottom:6px}
.sub>.th{padding:8px 10px}
.sub .nm{font-weight:500}
.sdet{padding:6px 10px 10px 34px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sdet span{flex:1 1 200px}
.ent{display:flex;gap:10px;align-items:center;padding:7px 2px;border-top:1px solid var(--line);flex-wrap:wrap}
.ent .nt{flex:1 1 140px;color:var(--mute)}
.empty{color:var(--mute);padding:6px 0}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:0;width:min(420px,calc(100% - 24px))}
dialog::backdrop{background:rgba(10,14,25,.5)}
dialog form{padding:18px;display:flex;flex-direction:column;gap:12px}
dialog h4{margin:0;font-size:16px}
dialog label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:110px;overflow:auto}.chip{display:inline-flex;align-items:center;background:var(--accbg);border-radius:12px;padding:2px 4px 2px 10px;font-size:13px}.chip button{background:none;border:0;color:var(--mute);padding:0 6px}
.hlist{list-style:none;margin:0;padding:0;max-height:min(58vh,520px);overflow:auto;border:1px solid var(--line);border-radius:8px}
.hlist li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 12px;border-top:1px solid var(--line);font-size:13px}.hlist li:first-child{border-top:0}
.hlist time{grid-column:1/-1;color:var(--mute);font-size:12px}
.htag{align-self:start;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--accbg);color:var(--ink)}
.htag.a{background:color-mix(in srgb,#0ea5e9 18%,var(--panel))}.htag.s{background:color-mix(in srgb,#10b981 18%,var(--panel))}.htag.e{background:color-mix(in srgb,#f59e0b 20%,var(--panel))}.htag.x{background:color-mix(in srgb,var(--bad) 18%,var(--panel))}
.hbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.hbar select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
.hist{max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:13px}.hist li{padding:5px 0;border-top:1px solid var(--line)}.hist li:first-child{border-top:0}.hist small{display:block;color:var(--mute)}
dialog.wide{width:min(920px,calc(100% - 24px))}.pv{max-height:58vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--bg)}.hint{color:var(--mute);font-size:13px}.acts{flex-wrap:wrap}button:disabled{opacity:.5;cursor:default}
/* ---------- Mapa mental ---------- */
#mm{position:fixed;inset:0;z-index:40;display:none;background-color:var(--bg);background-image:radial-gradient(var(--line) 1.2px,transparent 1.3px);background-size:24px 24px}
#mm.on{display:block}
#mmv{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;outline:none}
#mmv.pan{cursor:grabbing}
#mms{position:absolute;left:0;top:0;transform-origin:0 0}
#mml{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#mml path{fill:none;stroke-linecap:round}
.mn{position:absolute;left:0;top:0;width:max-content;max-width:300px}
.mc{padding:9px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.06);line-height:1.35;overflow-wrap:anywhere;animation:mmIn .35s cubic-bezier(.2,.9,.3,1.2) backwards}
.mc b{display:block;font-weight:600}
.mm-meta{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:6px;font-size:12px;color:var(--mute)}
.mm-chip{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,var(--bg));color:var(--ink);font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.mm-chip.over{color:var(--bad)}
.mm-bar{height:5px;margin-top:8px;border-radius:3px;background:var(--bar);overflow:hidden}.mm-bar i{display:block;height:100%;background:var(--c)}
.mn.d0 .mc{background:linear-gradient(135deg,#5e6ebb,#7c5cc4);color:#fff;border:0;padding:14px 22px;border-radius:16px;box-shadow:0 12px 30px -12px #5e6ebb}
.mn.d0 .mc b{font-size:17px}
.mn.d0 .mm-meta{color:rgba(255,255,255,.85)}.mn.d0 .mm-chip{background:rgba(255,255,255,.2);color:#fff}.mn.d0 .mm-bar{background:rgba(255,255,255,.25)}.mn.d0 .mm-bar i{background:#fff}
.mn.d1 .mc{background:color-mix(in srgb,var(--c) 13%,var(--panel));border:2px solid var(--c);border-radius:13px;padding:10px 16px}
.mn.d1 .mc b{font-size:15px}
.mn.d0,.mn.d1{max-width:360px}
.mn.d2 .mc{border-left:4px solid var(--c)}
.mm-tg{position:absolute;top:50%;left:100%;transform:translate(-50%,-50%);min-width:22px;height:22px;padding:0 6px;border-radius:999px;border:2px solid var(--c);background:var(--panel);color:var(--ink);font:600 11px/1 system-ui,sans-serif;display:grid;place-items:center;z-index:2}
.mm-tg:hover,.mn.col .mm-tg{background:var(--c);color:#fff}
.mmbar{position:absolute;top:12px;left:12px;right:12px;z-index:2;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px;background:color-mix(in srgb,var(--panel) 85%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.06)}
.mmbar h2{font-size:15px;margin:0 auto 0 6px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.mmbar .ghost{white-space:nowrap}
#mmz{min-width:54px;text-align:center;color:var(--mute);font-variant-numeric:tabular-nums}
.mm-hint{position:absolute;left:16px;bottom:16px;z-index:2;font-size:12px;color:var(--mute);padding:6px 10px;border-radius:10px;background:color-mix(in srgb,var(--panel) 85%,transparent);border:1px solid var(--line)}
.mm-empty{position:fixed;inset:0;display:grid;place-items:center;color:var(--mute);pointer-events:none}
@keyframes mmIn{from{opacity:0;transform:scale(.6)}}
@media (prefers-reduced-motion:reduce){.mc{animation:none}}
@media (max-width:600px){.mm-hint{display:none}.mmbar h2{flex-basis:100%;margin-bottom:2px}}
#prt{display:none}
@media print{body>*:not(#prt){display:none!important}#prt{display:block;--ink:#1c2230;--mute:#667085;--line:#dde1ea;--acc:#2f4bd6;--accbg:#e8ecfd;--bar:#e3e7f0;--bad:#c23b3b;color:var(--ink);font:12px/1.4 system-ui,sans-serif}body{background:#fff!important;margin:0}#prt .scroll{overflow:visible}#prt tr,#prt .rsum{break-inside:avoid}#prt h3{break-after:avoid}#prt *{-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{margin:14mm}}
@media (max-width:760px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}.sum{grid-template-columns:repeat(2,1fr)}main{padding:14px}.body{padding-left:14px}}
</style>
<style id="rst"></style>
</head>
<body>
<div class="app">
  <aside>
    <div class="ahead"><h1>Controle de Atividades</h1><button type="button" class="ib" data-a="theme" id="themeBtn"></button><button type="button" class="ib" data-a="side" id="sideBtnA"></button></div>
    <div class="net" id="net" role="status" hidden><i></i>Sem conexão. O app continua funcionando e salvando neste navegador.</div>
    <div class="row"><button class="btn" data-a="newp">Novo projeto</button><button class="ghost" data-a="impp">Importar projeto</button></div>
    <div class="plist" id="plist"></div>
  </aside>
  <main id="main"></main>
</div>
<dialog id="dlg"><form id="mf"></form></dialog>
<div id="prt" aria-hidden="true"></div>
<div id="mm" role="dialog" aria-modal="true" aria-labelledby="mmt">
  <div id="mmv" tabindex="0"><div id="mms"><svg id="mml"></svg><div id="mmn"></div></div></div>
  <div class="mmbar"><h2 id="mmt">Mapa mental</h2>
    <button type="button" class="ghost" data-mm="exp">Expandir tudo</button><button type="button" class="ghost" data-mm="col">Recolher tudo</button>
    <button type="button" class="ghost" data-mm="out" aria-label="Diminuir zoom">−</button><span id="mmz">100%</span><button type="button" class="ghost" data-mm="in" aria-label="Aumentar zoom">+</button>
    <button type="button" class="ghost" data-mm="fit">Ajustar à tela</button><button type="button" class="btn" data-mm="close">Fechar</button></div>
  <div class="mm-hint">Arraste para mover · Ctrl + roda do mouse para zoom · Esc para fechar</div>
</div>
<script>
const KEY='controle-atividades-v1';
let S={projects:[],sel:null};
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let SIDE=true;try{SIDE=localStorage.getItem(KEY+'-painel')!=='oculto'}catch(e){}
const applySide=()=>document.querySelector('.app').classList.toggle('noside',!SIDE);
const ICO={side:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9.5 4v16"/></svg>',
  moon:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
  sun:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'};
const sideBtn=()=>SIDE?'':`<button type="button" class="ib" data-a="side" aria-expanded="false" title="Abrir painel" aria-label="Abrir painel">${ICO.side}</button>`;
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches};
function paintChrome(){
  const tb=document.getElementById('themeBtn'),sb=document.getElementById('sideBtnA'),d=isDark();
  tb.innerHTML=d?ICO.sun:ICO.moon;const tl=d?'Usar tema claro':'Usar tema escuro';tb.title=tl;tb.setAttribute('aria-label',tl);
  sb.innerHTML=ICO.side;sb.title='Fechar painel';sb.setAttribute('aria-label','Fechar painel');sb.setAttribute('aria-expanded','true');
}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintChrome)}catch(e){}
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)&&n>=0?n:0};
const h=n=>(Math.round(n*100)/100).toLocaleString('pt-BR')+' h';
const pc=n=>Math.round(n)+'%';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fdate=s=>s?s.split('-').reverse().join('/'):'';
const open=new Set();
/* Feriados nacionais (Lei 662/1949, Lei 6.802/1980, Lei 14.759/2023) e Sexta-feira Santa;
   Carnaval e Corpus Christi são pontos facultativos (opção do projeto) */
const isoOf=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
function pascoa(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h2=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h2-k)%7,m=Math.floor((a+11*h2+22*l)/451),mo=Math.floor((h2+l-7*m+114)/31),da=((h2+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
const FERC=new Map();
function feriados(y,fac){
  const k=y+(fac?'f':'');if(FERC.has(k))return FERC.get(k);
  const r=new Map([['01-01','Confraternização Universal'],['04-21','Tiradentes'],['05-01','Dia do Trabalho'],['09-07','Independência do Brasil'],['10-12','Nossa Senhora Aparecida'],['11-02','Finados'],['11-15','Proclamação da República'],['12-25','Natal']].map(([d,n])=>[y+'-'+d,n]));
  if(y>=2024)r.set(y+'-11-20','Dia Nacional de Zumbi e da Consciência Negra');
  const P=pascoa(y),rel=(n,nome)=>{const d=new Date(P);d.setDate(d.getDate()+n);r.set(isoOf(d),nome)};
  rel(-2,'Sexta-feira Santa');
  if(fac){rel(-48,'Carnaval (segunda-feira)');rel(-47,'Carnaval (terça-feira)');rel(60,'Corpus Christi')}
  FERC.set(k,r);return r;
}
const feriado=(p,iso)=>p.hol===false?null:feriados(+iso.slice(0,4),p.fac!==false).get(iso)||null;
function forecast(p,est){
  if(!p.start||!(p.daily>0)||!(est>0))return null;
  const days=Math.ceil(est/p.daily-1e-9),d=new Date(p.start+'T00:00:00'),sk=new Set(p.skip||[]),hols=[];
  const wk=x=>{if(x.getDay()%6===0)return true;const i=isoOf(x);if(sk.has(i))return true;const f=feriado(p,i);if(f){hols.push(fdate(i)+' – '+f);return true}return false};
  while(wk(d))d.setDate(d.getDate()+1);
  for(let n=1;n<days;n++){d.setDate(d.getDate()+1);while(wk(d))d.setDate(d.getDate()+1)}
  return{days,end:isoOf(d),hols};
}
const holTxt=f=>f.hols.length?f.hols.length+' feriado(s) no período':'nenhum feriado no período';
const fcCard=(p,est)=>{const f=forecast(p,est);return `<div${f&&f.hols.length?` title="${esc('Feriados no período:\n'+f.hols.join('\n'))}"`:''}><span>Término previsto</span><b>${f?fdate(f.end):'—'}</b><span>${f?f.days+' dia(s) útil(eis) · '+h(p.daily)+' por dia'+(p.hol===false?'':' · '+holTxt(f))+((p.skip||[]).length?' · '+p.skip.length+' data(s) fora':''):'Informe início e horas por dia em Editar projeto'}</span></div>`};
const planTxt=(p,est)=>{const f=forecast(p,est);return f?` · Início ${fdate(p.start)} · ${h(p.daily)} por dia · término previsto ${fdate(f.end)} (${f.days} dias úteis${p.hol===false?'':', '+holTxt(f)+(f.hols.length?': '+f.hols.join('; '):'')}${(p.skip||[]).length?`, ${p.skip.length} data(s) desconsiderada(s)`:''})`:''};
const skipHtml=l=>l.length?l.map(d=>`<span class="chip">${fdate(d)}<button type="button" data-a="rmskip" data-d="${d}" aria-label="Remover ${fdate(d)}">✕</button></span>`).join(''):'<span class="hint">Nenhuma data desconsiderada.</span>';
/* ---------- Histórico ---------- */
const HT={p:'Projeto',a:'Atividade',s:'Subatividade',e:'Apontamento'};
const logH=(p,t,ch,del)=>{ch=ch.filter(Boolean);if(ch.length)(p.hist=p.hist||[]).push({at:Date.now(),t,del:!!del,ch})};
const entTxt=e=>fdate(e.date)+' · '+h(e.hours)+' · '+pc(e.pct)+(e.note?' · '+e.note:'');
let HF='';
function histList(p){
  const hs=[...(p.hist||[])].reverse().filter(x=>!HF||(x.t||'p')===HF);
  return hs.length?`<ul class="hlist">${hs.map(x=>{const t=x.t||'p';return `<li><time datetime="${new Date(x.at).toISOString()}">${new Date(x.at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</time><span class="htag ${x.del?'x':t}">${HT[t]}${x.del?(t==='e'?' excluído':' excluída'):''}</span><div>${x.ch.map(esc).join('<br>')}</div></li>`}).join('')}</ul>`:'<p class="hint">Nenhum registro'+(HF?' deste tipo':'')+' ainda.</p>';
}

const histHtml=p=>{const hs=[...(p.hist||[])].reverse();return `<div class="sec" style="margin:4px 0 0"><h3>Histórico de alterações</h3></div>`+(hs.length?`<ul class="hist">${hs.map(x=>`<li><small>${new Date(x.at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</small>${x.ch.map(esc).join('<br>')}</li>`).join('')}</ul>`:'<div class="hint">Nenhuma alteração registrada ainda.</div>')};

function actStats(a){
  const est=a.subs.reduce((t,s)=>t+s.est,0);
  const spent=a.entries.reduce((t,e)=>t+e.hours,0);
  const so=a.entries.map((e,i)=>[e,i]).sort((x,y)=>(x[0].date||'').localeCompare(y[0].date||'')||x[1]-y[1]);
  return{est,spent,pct:so.length?so[so.length-1][0].pct:0};
}
function projStats(p){
  const st=p.acts.map(actStats);
  const est=st.reduce((t,s)=>t+s.est,0),spent=st.reduce((t,s)=>t+s.spent,0);
  let pct=0;
  if(st.length)pct=est>0?st.reduce((t,s)=>t+s.est*s.pct,0)/est:st.reduce((t,s)=>t+s.pct,0)/st.length;
  return{est,spent,pct};
}
const cur=()=>S.projects.find(p=>p.id===S.sel);
const act=id=>cur().acts.find(a=>a.id===id);
const bar=v=>`<div class="bar mini"><i style="width:${Math.min(100,v)}%"></i></div>`;

function actHtml(a){
  const s=actStats(a),k='a:'+a.id,o=open.has(k),bal=s.est-s.spent;
  let body='';
  if(o){
    const ents=a.entries.map((e,i)=>[e,i]).sort((x,y)=>(y[0].date||'').localeCompare(x[0].date||'')||y[1]-x[1]).map(x=>x[0]);
    body=`<div class="body">
    <div class="row" style="margin-top:10px"><span class="st">Saldo: <b class="${bal<0?'over':''}">${h(bal)}</b></span><span class="sp"></span>
      <button class="ghost" data-a="edita" data-ai="${a.id}">Editar atividade</button><button class="ghost d" data-a="dela" data-ai="${a.id}">Excluir</button></div>
    <div class="sec"><h3>Subatividades (${a.subs.length})</h3><button class="btn" data-a="news" data-ai="${a.id}">Nova subatividade</button></div>
    ${a.subs.length?`<ul>${a.subs.map(u=>subHtml(a,u,s.est)).join('')}</ul>`:'<div class="empty">Sem subatividades.</div>'}
    <div class="sec"><h3>Apontamentos (${a.entries.length})</h3><button class="btn" data-a="newe" data-ai="${a.id}">Novo apontamento</button></div>
    ${ents.length?`<ul>${ents.map(e=>`<li class="ent"><span>${fdate(e.date)}</span><b>${h(e.hours)}</b><span>${pc(e.pct)}</span><span class="nt">${esc(e.note)}</span>
      <button class="ghost" data-a="edite" data-ai="${a.id}" data-ei="${e.id}">Editar</button><button class="ghost d" data-a="dele" data-ai="${a.id}" data-ei="${e.id}">Excluir</button></li>`).join('')}</ul>`:'<div class="empty">Nenhum apontamento.</div>'}
    </div>`;
  }
  return `<section class="act ${o?'open':''}"><button class="th" data-a="tog" data-k="${k}" aria-expanded="${o}">
    <span class="chev">▸</span><span class="nm">${esc(a.name)}</span>
    <span class="st">Est. ${h(s.est)} · Apontado ${h(s.spent)} · ${pc(s.pct)}</span>${bar(s.pct)}</button>${body}</section>`;

function subHtml(a,u,tot){
  const k='s:'+u.id,o=open.has(k);
  return `<li class="sub ${o?'open':''}"><button class="th" data-a="tog" data-k="${k}" aria-expanded="${o}"><span class="chev">▸</span><span class="nm">${esc(u.name)}</span><span class="st">${h(u.est)}</span></button>
  ${o?`<div class="sdet"><span>${tot>0?pc(u.est/tot*100):'0%'} da estimativa da atividade</span>
  <button class="ghost" data-a="edits" data-ai="${a.id}" data-si="${u.id}">Editar</button><button class="ghost d" data-a="dels" data-ai="${a.id}" data-si="${u.id}">Excluir</button></div>`:''}</li>`;
}

const fld=(l,n,v,ex='')=>`<label>${l}<input name="${n}" value="${esc(v)}" ${ex}></label>`;
function modal(kind,mode,c={}){
  M={kind,mode,c};
  let ob={},title='',f='',btn='Salvar';
  if(mode==='edit'){
    if(kind==='p')ob=cur();
    else if(kind==='a')ob=act(c.ai);
    else if(kind==='s')ob=act(c.ai).subs.find(x=>x.id===c.si);
    else ob=act(c.ai).entries.find(x=>x.id===c.ei);
  }
  const nome={p:'projeto',a:'atividade',s:'subatividade',e:'apontamento'}[kind];
  if(mode==='del'){
    title='Excluir '+nome;btn='Excluir';
    f=`<p style="margin:0">Esta ação não pode ser desfeita${kind==='p'||kind==='a'?' e remove tudo o que está dentro.':'.'}</p>`;
  }else{
    title=(mode==='new'?'Novo ':'Editar ')+nome;
    if(kind==='a')f=fld('Nome','name',ob.name||'','required autofocus');
    if(kind==='p')M.c.skip=[...(ob.skip||[])].sort();
    if(kind==='p')f=fld('Nome','name',ob.name||'','required autofocus')+`<div class="g2">${fld('Data de início','start',ob.start||today(),'type="date" required')}${fld('Horas por dia','daily',ob.daily??8,'type="number" min="0.25" step="0.25" required')}</div><div class="hint">O término previsto considera dias úteis (segunda a sexta), exceto feriados nacionais e as datas abaixo.</div><label class="chk"><input type="checkbox" name="hol" ${ob.hol===false?'':'checked'}><span>Desconsiderar feriados nacionais (Confraternização, Sexta-feira Santa, Tiradentes, Trabalho, Independência, Aparecida, Finados, República, Consciência Negra e Natal)</span></label><label class="chk"><input type="checkbox" name="fac" ${ob.fac===false?'':'checked'}><span>Desconsiderar também Carnaval (segunda e terça) e Corpus Christi, que são pontos facultativos</span></label><div><div class="hint" style="margin-bottom:4px">Outras datas desconsideradas (feriados estaduais e municipais, folgas)</div><div class="row"><input type="date" id="skd" style="flex:1" aria-label="Data a desconsiderar"><button type="button" class="ghost" data-a="addskip">Adicionar data</button></div><div class="chips" id="skl" style="margin-top:8px">${skipHtml(M.c.skip)}</div></div>`;
    if(kind==='s')f=fld('Nome','name',ob.name||'','required autofocus')+fld('Estimativa (horas)','est',ob.est??'','type="number" min="0" step="0.25" required');
    if(kind==='e')f=`<div class="g2">${fld('Data','date',ob.date||today(),'type="date" required')}${fld('Tempo (horas)','hours',ob.hours??'','type="number" min="0" step="0.25" required autofocus')}</div>`+
      fld('Percentual atingido (%)','pct',ob.pct??'','type="number" min="0" max="100" step="1" required')+fld('Observação','note',ob.note||'');
  }
  mf.innerHTML=`<h4>${title}</h4>${f}<div class="acts"><button type="button" class="ghost" data-a="close">Cancelar</button><button class="btn ${mode==='del'?'del':''}" type="submit">${btn}</button></div>`;
  dlg.showModal();
}
mf.addEventListener('submit',ev=>{
  ev.preventDefault();
  if(!M)return;if(M.kind==='imp')return doImport();const {kind,mode,c}=M,d=new FormData(mf),g=n=>(d.get(n)||'').toString().trim();
  if(mode==='del'){
    if(kind==='p')S.projects=S.projects.filter(p=>p.id!==S.sel);
    else if(kind==='a'){const a=act(c.ai);logH(cur(),'a',[a.name+' ('+a.subs.length+' subatividade(s), '+a.entries.length+' apontamento(s))'],1);cur().acts=cur().acts.filter(x=>x.id!==c.ai)}
    else if(kind==='s'){const a=act(c.ai),u=a.subs.find(x=>x.id===c.si);logH(cur(),'s',[u.name+' ('+h(u.est)+') · atividade '+a.name],1);a.subs=a.subs.filter(x=>x.id!==c.si)}
    else{const a=act(c.ai),e=a.entries.find(x=>x.id===c.ei);logH(cur(),'e',[entTxt(e)+' · atividade '+a.name],1);a.entries=a.entries.filter(x=>x.id!==c.ei)}
  }else if(kind==='p'){
    const v={name:g('name'),start:g('start'),daily:num(g('daily'))||8,skip:[...(c.skip||[])].sort(),hol:d.get('hol')==='on',fac:d.get('fac')==='on'};
    if(mode==='new'){const p={id:uid(),...v,acts:[],hist:[{at:Date.now(),t:'p',ch:['Cadastro: início '+fdate(v.start)+', '+h(v.daily)+' por dia'+(v.skip.length?', '+v.skip.length+' data(s) desconsiderada(s)':'')]}]};S.projects.push(p);S.sel=p.id}
    else{const p=cur(),ch=[],cmp=(l,a,b)=>{if(a!==b)ch.push(l+': '+(a||'—')+' → '+b)};
      cmp('Nome',p.name,v.name);cmp('Início',p.start?fdate(p.start):'',fdate(v.start));cmp('Horas por dia',p.daily?h(p.daily):'',h(v.daily));const sn=x=>x?'Sim':'Não';cmp('Feriados nacionais',sn(p.hol!==false),sn(v.hol));cmp('Carnaval e Corpus Christi',sn(p.fac!==false),sn(v.fac));
      const oa=p.skip||[],ad=v.skip.filter(x=>!oa.includes(x)),rm=oa.filter(x=>!v.skip.includes(x));
      if(ad.length)ch.push('Datas desconsideradas adicionadas: '+ad.map(fdate).join(', '));
      if(rm.length)ch.push('Datas desconsideradas removidas: '+rm.map(fdate).join(', '));
      logH(p,'p',ch);Object.assign(p,v)}
  }else if(kind==='a'){
    if(mode==='new'){const a={id:uid(),name:g('name'),subs:[],entries:[]};cur().acts.push(a);open.add('a:'+a.id);logH(cur(),'a',['Criada: '+a.name])}
    else{const a=act(c.ai),nv=g('name');if(a.name!==nv)logH(cur(),'a',['Renomeada: '+a.name+' → '+nv]);a.name=nv}
  }else if(kind==='s'){
    const a=act(c.ai);
    if(mode==='new'){const u={id:uid(),name:g('name'),est:num(g('est'))};a.subs.push(u);logH(cur(),'s',['Criada: '+u.name+' ('+h(u.est)+') · atividade '+a.name])}
    else{const u=a.subs.find(x=>x.id===c.si),nv=g('name'),ne=num(g('est'));logH(cur(),'s',[u.name!==nv&&'Nome: '+u.name+' → '+nv,u.est!==ne&&'Estimativa de '+nv+': '+h(u.est)+' → '+h(ne)].map(x=>x&&x+' · atividade '+a.name));u.name=nv;u.est=ne}
  }else{
    const a=act(c.ai),v={date:g('date'),hours:num(g('hours')),pct:Math.min(100,num(g('pct'))),note:g('note')};
    if(mode==='new'){a.entries.push({id:uid(),...v});logH(cur(),'e',['Novo: '+entTxt(v)+' · atividade '+a.name])}
    else{const e=a.entries.find(x=>x.id===c.ei),cg=[];
      if(e.date!==v.date)cg.push('Data: '+fdate(e.date)+' → '+fdate(v.date));if(e.hours!==v.hours)cg.push('Tempo: '+h(e.hours)+' → '+h(v.hours));if(e.pct!==v.pct)cg.push('Percentual: '+pc(e.pct)+' → '+pc(v.pct));if(e.note!==v.note)cg.push('Observação: '+(e.note||'—')+' → '+(v.note||'—'));
      if(cg.length)logH(cur(),'e',['Apontamento de '+fdate(e.date)+' · atividade '+a.name+':',...cg]);Object.assign(e,v)}
  }
  save();dlg.close();render();
});

const dif=(est,spent)=>{const d=spent-est,sg=d>0?"+":d<0?"−":"";return sg+h(Math.abs(d))+(est>0?` (${sg}${Math.abs(Math.round(d/est*100))}%)`:"")};
const sit=(a,s)=>s.pct>=100?'Concluída':(s.pct===0&&!a.entries.length)?'Não iniciada':(s.est>0&&s.spent>s.est)?'Acima da estimativa':'Em andamento';
const proj=(pct,spent)=>pct>0?h(spent/(pct/100)):'—';
/* nome do arquivo: nome_do_projeto_ddmmaa_hhmm (data e hora da exportação) */
const fileBase=p=>{const d=new Date(),z=n=>String(n).padStart(2,"0");return (p.name.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/gi,"_").replace(/^_+|_+$/g,"").toLowerCase()||"projeto")+"_"+z(d.getDate())+z(d.getMonth()+1)+String(d.getFullYear()).slice(-2)+"_"+z(d.getHours())+z(d.getMinutes())};

function reportBody(p){

    a.subs.forEach(u=>{rows+=`<tr class="sb"><td>${esc(u.name)}</td><td></td><td class="n">${h(u.est)}</td><td></td><td></td><td>${s.est>0?pc(u.est/s.est*100)+' da atividade':''}</td><td></td></tr>`});

  <h3>Andamento das atividades</h3><div class="scroll"><table><thead><tr><th>Atividade / subatividade</th><th>Situação</th><th class="n">Estimativa</th><th class="n">Apontado</th><th class="n">Diferença (real − estimado)</th><th>Andamento</th><th class="n">Projeção</th></tr></thead>

function csv(p){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"',d=n=>String(Math.round(n*100)/100).replace('.',',');
  const L=[['Tipo','Atividade','Subatividade','Data','Estimativa (h)','Apontado (h)','Diferença (h)','Diferença (%)','Percentual','Situação','Observação']];
  p.acts.forEach(a=>{const s=actStats(a);
    L.push(['Atividade',a.name,'','',d(s.est),d(s.spent),d(s.spent-s.est),s.est>0?d((s.spent-s.est)/s.est*100)+'%':'',d(s.pct)+'%',sit(a,s),'']);
    a.subs.forEach(u=>L.push(['Subatividade',a.name,u.name,'',d(u.est),'','','','','','']));

  if(a==='out')return mmZoomC(1/1.2);
  if(a==='exp'){mm.col.clear();mmRender();return mmFit()}
  if(a==='col'){cur().acts.forEach(x=>mm.col.add(x.id));mmRender();return mmFit()}
});
mm.v.addEventListener('wheel',ev=>{ev.preventDefault();if(ev.ctrlKey||ev.metaKey)mmZoom(Math.exp(-ev.deltaY*.0022),ev.clientX,ev.clientY);else{mm.view.x-=ev.shiftKey?ev.deltaY:ev.deltaX;mm.view.y-=ev.shiftKey?0:ev.deltaY;mmApply()}},{passive:false});
{let drag=null;const pts=new Map();
mm.v.addEventListener('pointerdown',ev=>{if(ev.target.closest('button'))return;pts.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});try{mm.v.setPointerCapture(ev.pointerId)}catch(e){}mm.v.classList.add('pan');drag={x:ev.clientX,y:ev.clientY,vx:mm.view.x,vy:mm.view.y,d:null}});
mm.v.addEventListener('pointermove',ev=>{if(!drag||!pts.has(ev.pointerId))return;pts.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(pts.size===2){const [p1,p2]=[...pts.values()],d=Math.hypot(p1.x-p2.x,p1.y-p2.y);if(drag.d)mmZoom(d/drag.d,(p1.x+p2.x)/2,(p1.y+p2.y)/2);drag.d=d;return}
  mm.view.x=drag.vx+ev.clientX-drag.x;mm.view.y=drag.vy+ev.clientY-drag.y;mmApply()});
const up=ev=>{pts.delete(ev.pointerId);if(!pts.size){drag=null;mm.v.classList.remove('pan')}else if(drag){const p=[...pts.values()][0];drag={x:p.x,y:p.y,vx:mm.view.x,vy:mm.view.y,d:null}}};
mm.v.addEventListener('pointerup',up);mm.v.addEventListener('pointercancel',up);}
document.addEventListener('keydown',ev=>{if(!mm.el.classList.contains('on'))return;
  if(ev.key==='Escape'){ev.preventDefault();mmClose()}else if(ev.target.tagName!=='INPUT'){if(ev.key==='+'||ev.key==='=')mmZoomC(1.2);else if(ev.key==='-')mmZoomC(1/1.2);else if(ev.key==='0')mmFit()}});
window.addEventListener('resize',()=>{if(mm.el.classList.contains('on'))mmFit()});

document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,D=b.dataset;
  if(a==='close')return dlg.close();
  if(a==='theme'){const t=isDark()?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem(KEY+'-tema',t)}catch(e){}return paintChrome()}
  if(a==='side'){SIDE=!SIDE;try{localStorage.setItem(KEY+'-painel',SIDE?'visivel':'oculto')}catch(e){}return render()}
  if(a==='hist')return histModal();
  if(a==='mmap')return mmOpen();
  if(a==='export')return exportModal();
  if(a==='impp')return importModal();
  if(a==='addskip'){const i=document.getElementById('skd'),v=i.value;if(v&&!M.c.skip.includes(v)){M.c.skip.push(v);M.c.skip.sort();document.getElementById('skl').innerHTML=skipHtml(M.c.skip)}i.value='';return}
  if(a==='rmskip'){M.c.skip=M.c.skip.filter(x=>x!==D.d);document.getElementById('skl').innerHTML=skipHtml(M.c.skip);return}
  if(a==='print')return printReport();
  if(a.startsWith('copy-'))return copyText(a);
  if(a.startsWith('dl-'))return download(a);
  if(a==='selp'){S.sel=D.p;save();return render()}
  if(a==='tog'){open.has(D.k)?open.delete(D.k):open.add(D.k);return render()}
  const kind={p:'p',a:'a',s:'s',e:'e'}[a.slice(-1)];
  const mode=a.startsWith('new')?'new':a.startsWith('edit')?'edit':'del';
  modal(kind,mode,{ai:D.ai,si:D.si,ei:D.ei});
});
/* ---------- Funcionamento offline (sem instalação: não há manifesto) ---------- */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!window.claude){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
const netUI=()=>{document.getElementById('net').hidden=navigator.onLine};
window.addEventListener('online',netUI);window.addEventListener('offline',netUI);netUI();
render();
