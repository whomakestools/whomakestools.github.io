<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestão de Cartões de Crédito</title>
<style>
:root{--bg:#e8ebf0;--sf:#fff;--tx:#1b1f24;--mu:#667085;--bd:#cdd3dc;--ac:#4f46e5;--ac2:#eef0ff;--ok:#15803d;--dg:#b42318;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d11;--sf:#1a1f26;--tx:#e8ebef;--mu:#98a2b3;--bd:#2b323c;--ac:#8b85ff;--ac2:#242a45;--ok:#4ade80;--dg:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0d11;--sf:#1a1f26;--tx:#e8ebef;--mu:#98a2b3;--bd:#2b323c;--ac:#8b85ff;--ac2:#242a45;--ok:#4ade80;--dg:#f87171;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:20px;margin:0}
h2{font-size:16px;margin:0 0 10px}
.btn{border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.del{color:var(--dg)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.total{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
.kpi small{color:var(--mu);display:block}
.kpi b{font-size:22px}
.kpi.main{background:var(--ac);border-color:var(--ac);color:#fff}
.kpi.main small{color:#e0e0ff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--sf);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:12px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.card.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac2)}
.card h3{margin:0;font-size:16px;display:flex;justify-content:space-between;gap:8px}
.open{font-size:24px;font-weight:700;margin:6px 0}
.open.zero{color:var(--ok)}
.bar{height:6px;background:var(--bd);border-radius:4px;overflow:hidden;margin:6px 0 8px}
.bar i{display:block;height:100%;background:var(--ok)}
.meta{display:flex;justify-content:space-between;color:var(--mu);font-size:13px;gap:8px;flex-wrap:wrap}
.card .row{margin-top:10px}
.panel{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-top:20px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:600;font-size:12px;text-transform:uppercase}
td.r,th.r{text-align:right}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--ac2);color:var(--ac)}
.tag.t{background:#dcfce7;color:#166534}
.muted{color:var(--mu)}
.empty{color:var(--mu);padding:20px;text-align:center;border:1px dashed var(--bd);border-radius:12px}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--sf);color:var(--tx);padding:20px;width:min(420px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input:read-only{opacity:.7}
.radios{display:flex;gap:16px}
.radios label{display:flex;align-items:center;gap:6px;color:var(--tx);margin:4px 0}
.radios input{width:auto}
.acts{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:16px}
.hint{font-size:12px;color:var(--mu);margin-top:4px}
.mes{align-items:center}.mes input{width:auto}
.btn:disabled{opacity:.5;cursor:not-allowed}.btn:disabled:hover{border-color:var(--bd)}
.tw{position:relative}
.tbl{-webkit-overflow-scrolling:touch}
.tw::before,.tw::after{content:"";position:absolute;top:0;bottom:0;width:32px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:1}
.tw::before{left:0;background:linear-gradient(to right,var(--sf),transparent)}
.tw::after{right:0;background:linear-gradient(to left,var(--sf),transparent)}
.tw.cl::before,.tw.cr::after{opacity:1}
.sb{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;padding:0;border-radius:50%;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font-size:22px;line-height:1;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.35);display:none;z-index:2}
.sl{left:2px}.sr{right:2px}
.tw.cl .sl,.tw.cr .sr{display:block}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Gestão de Cartões de Crédito</h1>
    <div class="row mes"><button class="btn sm" id="mPrev" title="Mês anterior">‹</button><input type="month" id="mSel" aria-label="Mês e ano"><button class="btn sm" id="mNext" title="Próximo mês">›</button></div>
    <div class="row">
      <button class="btn" id="bTheme" title="Alternar tema"></button>
      <button class="btn" id="bCard">+ Cartão</button>
      <button class="btn" id="bEntry">+ Lançamento</button>
      <button class="btn pri" id="bPay">Registrar pagamento</button>
    </div>
  </header>

  <div id="backRow" style="margin-bottom:12px"></div>
  <section class="total" id="totals"></section>
  <section class="grid" id="cards"></section>
  <section id="detail"></section>
  <div id="arqBar" style="margin-top:28px;text-align:center"></div>
</div>

<dialog id="dCard"><form method="dialog" onsubmit="return false">
  <h2>Novo cartão</h2>
  <label>Nome do cartão</label><input id="cName" placeholder="Ex.: Nubank, Itaú Visa">
  <label>Final (opcional)</label><input id="cLast" maxlength="4" placeholder="1234">
  <label>Dia de vencimento</label><input id="cDue" type="number" min="1" max="31" placeholder="Ex.: 10">
  <div class="acts"><button class="btn" data-close>Cancelar</button><button class="btn pri" id="okCard">Salvar</button></div>
</form></dialog>

<dialog id="dEntry"><form method="dialog" onsubmit="return false">
  <h2>Novo lançamento</h2>
  <label>Cartão</label><select id="eCard"></select>
  <label>Descrição da compra</label><input id="eDesc" placeholder="Ex.: Geladeira">
  <label>Valor da parcela (R$)</label><input id="eVal" type="number" step="0.01" min="0.01">
  <label>Número de parcelas</label><input id="eQtd" type="number" min="1" value="1">
  <label>Início da cobrança (mês)</label><input id="eIni" type="month">
  <div class="hint" id="eSum"></div>
  <div class="acts"><button class="btn" data-close>Cancelar</button><button class="btn pri" id="okEntry">Salvar</button></div>
</form></dialog>

<dialog id="dPay"><form method="dialog" onsubmit="return false">
  <h2>Registrar pagamento</h2>
  <label>Cartão</label><select id="pCard"></select>
  <label>Mês de referência</label><input id="pRef" type="month">
  <div class="hint" id="pOpen"></div>
  <label>Tipo</label>
  <div class="radios">
    <label><input type="radio" name="pTipo" value="total" checked> Total</label>
    <label><input type="radio" name="pTipo" value="parcial"> Parcial</label>
  </div>
  <label>Valor pago (R$)</label><input id="pVal" type="number" step="0.01" min="0.01">
  <label>Data</label><input id="pDate" type="date">
  <label>Observação (opcional)</label><input id="pObs">
  <div class="acts"><button class="btn" data-close>Cancelar</button><button class="btn pri" id="okPay">Salvar</button></div>
</form></dialog>

<dialog id="dAsk"><form method="dialog" onsubmit="return false">
  <h2 id="aTit">Atenção</h2>
  <p id="aTxt" style="margin:0 0 4px;white-space:pre-line"></p>
  <input id="aIn" type="number" min="1" max="31" hidden>
  <div class="acts"><button class="btn" id="aNo">Cancelar</button><button class="btn" id="aMid" hidden></button><button class="btn pri" id="aYes">Confirmar</button></div>
</form></dialog>

<script>
(function(){
var KEY="gestao-cartoes-v1", mem=null;
var S={cards:[],entries:[],payments:[],sel:null};
function load(){try{var r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){if(mem)S=mem;}S.mes=nowM();S.verArq=false;S.sel=null;}
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var $=function(id){return document.getElementById(id)};
var brl=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var nowM=function(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
var mIdx=function(m){var p=m.split("-");return +p[0]*12+ +p[1]-1};
var mFmt=function(i){var y=Math.floor(i/12),m=i%12+1;return String(m).padStart(2,"0")+"/"+y};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var r2=function(n){return Math.round(n*100)/100};

function refOf(x){return x.ref||x.data.slice(0,7)}
function noMes(e){var k=mIdx(S.mes)-mIdx(e.inicio)+1;return k>=1&&k<=e.qtd?k+"/"+e.qtd:"–"}
function stats(cid,m){
  m=m||S.mes;var cur=mIdx(m),l=0,p=0,mes=0,pm=0;
  S.entries.forEach(function(e){if(e.cardId!==cid)return;
    l+=e.valor*e.qtd;var s=mIdx(e.inicio);
    if(cur>=s&&cur<s+e.qtd)mes+=e.valor;});
  S.payments.forEach(function(x){if(x.cardId!==cid)return;p+=x.valor;if(refOf(x)===m)pm+=x.valor;});
  mes=r2(mes);pm=r2(pm);
  return{lancado:r2(l),pago:r2(p),aberto:Math.max(0,r2(l-p)),mes:mes,pagoMes:pm,apagar:Math.max(0,r2(mes-pm))};
}

function render(){
  $("mSel").value=S.mes;
  $("backRow").innerHTML=S.sel?'<button class="btn" data-a="back">← Voltar</button>':(S.verArq?'<h2>Cartões arquivados</h2>':'');
  var pool=S.cards.filter(function(c){return !!c.arq===!!S.verArq});
  var sc=S.sel?S.cards.filter(function(c){return c.id===S.sel}):pool;
  if(S.sel&&!sc.length){S.sel=null;sc=pool;}
  var pm=0,pg=0,ap=0,ab=0;
  sc.forEach(function(c){var s=stats(c.id);pm+=s.mes;pg+=s.pagoMes;ap+=s.apagar;ab+=s.aberto;});
  $("totals").innerHTML=
    '<div class="kpi main"><small>A pagar em '+mFmt(mIdx(S.mes))+'</small><b>'+brl.format(ap)+'</b></div>'+
    '<div class="kpi"><small>Parcelas do mês</small><b>'+brl.format(pm)+'</b></div>'+
    '<div class="kpi"><small>Pago no mês</small><b>'+brl.format(pg)+'</b></div>'+
    (S.sel?'<div class="kpi"><small>Total em aberto do cartão</small><b>'+brl.format(ab)+'</b></div>':'');
  if(S.verArq&&!S.sel)$("totals").innerHTML="";
  if(S.verArq&&!sc.length){$("cards").innerHTML='<div class="empty" style="grid-column:1/-1">Nenhum cartão arquivado.</div>';}
  else if(!sc.length){$("cards").innerHTML='<div class="empty" style="grid-column:1/-1">Nenhum cartão cadastrado. Clique em “+ Cartão” para começar.</div>';}
  else $("cards").innerHTML=sc.map(function(c){
    var s=stats(c.id),pc=s.mes?Math.min(100,s.pagoMes/s.mes*100):(s.pagoMes?100:0);
    return '<div class="card'+(S.sel===c.id?' sel':'')+'"><h3><span>'+esc(c.nome)+(c.final?' <span class="muted">•••• '+esc(c.final)+'</span>':'')+'</span></h3>'+
      '<div class="muted" style="font-size:13px">'+(c.venc?'Vence todo dia '+c.venc:'Vencimento não informado')+'</div>'+
      '<div class="open'+(s.apagar===0?' zero':'')+'">'+brl.format(s.apagar)+'</div><div class="muted" style="font-size:12px">a pagar no mês</div>'+
      '<div class="bar"><i style="width:'+pc+'%"></i></div>'+
      '<div class="meta"><span>Parcelas: '+brl.format(s.mes)+'</span><span>Pago: '+brl.format(s.pagoMes)+'</span></div>'+
      
      '<div class="row">'+(c.arq?'':'<button class="btn sm" data-a="entry" data-id="'+c.id+'">+ Lançar</button>')+
      (c.arq?'':'<button class="btn sm" data-a="pay" data-id="'+c.id+'"'+(s.mes===0?' disabled title="Sem parcela no mês selecionado"':'')+'>Pagar</button>')+
      '<button class="btn sm" data-a="det" data-id="'+c.id+'">'+(S.sel===c.id?'Fechar':'Detalhes')+'</button>'+(c.arq?'<button class="btn sm" data-a="unarq" data-id="'+c.id+'">Desarquivar</button>':'')+'</div></div>';
  }).join("");
  renderDetail();
  var na=S.cards.filter(function(c){return c.arq}).length;
  $("arqBar").innerHTML=(S.sel||(!na&&!S.verArq))?"":(S.verArq?'<button class="btn" data-a="verarq">← Voltar aos cartões ativos</button>':'<button class="btn" data-a="verarq">Ver cartões arquivados ('+na+')</button>');
}

function setupScroll(){
  document.querySelectorAll("#detail .tbl").forEach(function(t){
    var w=document.createElement("div");w.className="tw";
    t.parentNode.insertBefore(w,t);w.appendChild(t);
    var l=document.createElement("button"),r=document.createElement("button");
    l.className="sb sl";r.className="sb sr";l.textContent="‹";r.textContent="›";
    l.setAttribute("aria-label","Rolar para a esquerda");r.setAttribute("aria-label","Rolar para a direita");
    l.onclick=function(){t.scrollBy({left:-180,behavior:"smooth"})};
    r.onclick=function(){t.scrollBy({left:180,behavior:"smooth"})};
    w.appendChild(l);w.appendChild(r);
    t._u=function(){var m=t.scrollWidth-t.clientWidth;w.classList.toggle("cl",t.scrollLeft>2);w.classList.toggle("cr",m>2&&t.scrollLeft<m-2);};
    t.addEventListener("scroll",t._u);t._u();setTimeout(t._u,60);
  });
}
window.addEventListener("resize",function(){document.querySelectorAll("#detail .tbl").forEach(function(t){if(t._u)t._u()})});
function renderDetail(){
  var c=S.cards.filter(function(x){return x.id===S.sel})[0];
  if(!c){$("detail").innerHTML="";return;}
  var es=S.entries.filter(function(e){var k=mIdx(S.mes)-mIdx(e.inicio);return e.cardId===c.id&&k>=0&&k<e.qtd});
  var ps=S.payments.filter(function(x){return x.cardId===c.id&&refOf(x)===S.mes}).sort(function(a,b){return b.data.localeCompare(a.data)});
  var h='<div class="panel"><div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px"><h2 style="margin:0">'+esc(c.nome)+'</h2><span class="row"><button class="btn sm" data-a="due" data-id="'+c.id+'">Alterar vencimento</button><button class="btn sm" data-a="'+(c.arq?'unarq':'arq')+'" data-id="'+c.id+'">'+(c.arq?'Desarquivar':'Arquivar')+'</button><button class="btn sm del" data-a="delcard" data-id="'+c.id+'">Excluir cartão</button></span></div>';
  h+='<h2>Lançamentos de '+mFmt(mIdx(S.mes))+'</h2>';
  if(!es.length)h+='<div class="empty">Sem lançamentos neste cartão em '+mFmt(mIdx(S.mes))+'.</div>';
  else h+='<div class="tbl"><table><tr><th>Descrição</th><th class="r">Parcela</th><th class="r">Parcelas</th><th>Início</th><th>Fim</th><th class="r">No mês</th><th class="r">Total</th><th></th></tr>'+
    es.map(function(e){var s=mIdx(e.inicio);
      return '<tr><td>'+esc(e.desc)+'</td><td class="r">'+brl.format(e.valor)+'</td><td class="r">'+e.qtd+'x</td><td>'+mFmt(s)+'</td><td>'+mFmt(s+e.qtd-1)+'</td><td class="r">'+noMes(e)+'</td><td class="r">'+brl.format(r2(e.valor*e.qtd))+'</td><td><button class="btn sm del" data-a="dele" data-id="'+e.id+'">Excluir</button></td></tr>';}).join("")+'</table></div>';
  h+='<h2 style="margin-top:20px">Pagamentos de '+mFmt(mIdx(S.mes))+'</h2>';
  if(!ps.length)h+='<div class="empty">Nenhum pagamento em '+mFmt(mIdx(S.mes))+'.</div>';
  else h+='<div class="tbl"><table><tr><th>Data</th><th>Ref.</th><th>Tipo</th><th class="r">Valor</th><th>Obs.</th><th></th></tr>'+
    ps.map(function(x){var d=x.data.split("-").reverse().join("/");
      return '<tr><td>'+d+'</td><td>'+mFmt(mIdx(refOf(x)))+'</td><td><span class="tag'+(x.tipo==="total"?' t':'')+'">'+(x.tipo==="total"?'Total':'Parcial')+'</span></td><td class="r">'+brl.format(x.valor)+'</td><td>'+esc(x.obs||"")+'</td><td><button class="btn sm del" data-a="delp" data-id="'+x.id+'">Excluir</button></td></tr>';}).join("")+'</table></div>';
  $("detail").innerHTML=h+'</div>';setupScroll();
}

function fillSelects(sel){
  var o=S.cards.filter(function(c){return !c.arq}).map(function(c){return '<option value="'+c.id+'">'+esc(c.nome)+'</option>'}).join("");
  $("eCard").innerHTML=o;$("pCard").innerHTML=o;
  if(sel){$("eCard").value=sel;$("pCard").value=sel;}
}
function needCard(){if(!S.cards.some(function(c){return !c.arq})){msg("Cadastre um cartão primeiro.");return false}return true}

function openCard(){$("cName").value="";$("cLast").value="";$("cDue").value="";$("dCard").showModal();$("cName").focus();}
function openEntry(id){if(!needCard())return;fillSelects(id||S.sel);$("eDesc").value="";$("eVal").value="";$("eQtd").value=1;$("eIni").value=S.mes;sumE();$("dEntry").showModal();}
function sumE(){var v=+$("eVal").value,q=+$("eQtd").value;$("eSum").textContent=v>0&&q>0?"Total da compra: "+brl.format(r2(v*q)):"";}
function openPay(id){if(!needCard())return;fillSelects(id||S.sel);$("pRef").value=S.mes;$("pDate").value=new Date().toISOString().slice(0,10);$("pObs").value="";document.querySelector('input[name="pTipo"][value="total"]').checked=true;syncPay();$("dPay").showModal();}
function tipo(){return document.querySelector('input[name="pTipo"]:checked').value}
function syncPay(){
  var st=stats($("pCard").value,$("pRef").value||S.mes),a=st.apagar;
  $("pOpen").textContent=st.mes===0?"Sem parcela neste cartão no mês de referência: não é possível lançar pagamento.":"A pagar neste cartão no mês de referência: "+brl.format(a);$("okPay").disabled=st.mes===0;
  if(tipo()==="total"){$("pVal").value=a.toFixed(2);$("pVal").readOnly=true;}
  else{$("pVal").readOnly=false;if(+$("pVal").value===a)$("pVal").value="";}
}

$("bCard").onclick=openCard;
$("bEntry").onclick=function(){openEntry()};
$("bPay").onclick=function(){openPay()};
document.querySelectorAll("[data-close]").forEach(function(b){b.onclick=function(){b.closest("dialog").close()}});
$("eVal").oninput=sumE;$("eQtd").oninput=sumE;
$("pCard").onchange=syncPay;$("pRef").onchange=syncPay;
document.querySelectorAll('input[name="pTipo"]').forEach(function(r){r.onchange=syncPay});

$("okCard").onclick=function(){
  var n=$("cName").value.trim();if(!n){msg("Informe o nome do cartão.");return}
  var vd=parseInt($("cDue").value,10);if(!(vd>=1&&vd<=31)){msg("Informe o dia de vencimento (1 a 31).");return}
  var c={id:uid(),nome:n,final:$("cLast").value.trim(),venc:vd};
  S.cards.push(c);save();$("dCard").close();render();
};
$("okEntry").onclick=function(){
  var d=$("eDesc").value.trim(),v=+$("eVal").value,q=Math.floor(+$("eQtd").value),i=$("eIni").value;
  if(!d||!(v>0)||!(q>=1)||!i){msg("Preencha descrição, valor da parcela, nº de parcelas e início da cobrança.");return}
  S.entries.push({id:uid(),cardId:$("eCard").value,desc:d,valor:r2(v),qtd:q,inicio:i});
  save();$("dEntry").close();render();
};
function addPay(cid,v,dt,ref){S.payments.push({id:uid(),cardId:cid,valor:v,tipo:tipo(),data:dt,ref:ref,obs:$("pObs").value.trim()});save();$("dPay").close();render();}
$("okPay").onclick=function(){
  var cid=$("pCard").value,ref=$("pRef").value,v=r2(+$("pVal").value),a=ref?stats(cid,ref).apagar:0,dt=$("pDate").value;
  if(ref&&stats(cid,ref).mes===0){msg("Não é possível lançar pagamento: a parcela deste cartão no mês de referência é zero.");return}
  if(!(v>0)){msg(a>0?"Informe o valor pago.":"Este cartão não possui valor a pagar no mês de referência.");return}
  if(!dt||!ref){msg("Informe a data e o mês de referência.");return}
  if(v>a){ask("O valor ("+brl.format(v)+") é maior que o valor a pagar no mês ("+brl.format(a)+"). Registrar mesmo assim?",function(){addPay(cid,v,dt,ref)},{ok:"Registrar"});return}
  addPay(cid,v,dt,ref);
  
};

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;
  var a=b.dataset.a,id=b.dataset.id;
  if(a==="entry")openEntry(id);
  else if(a==="pay")openPay(id);
  else if(a==="det"){S.sel=S.sel===id?null:id;render();window.scrollTo(0,0);}
  else if(a==="back"){S.sel=null;render();window.scrollTo(0,0);}
  else if(a==="verarq"){S.verArq=!S.verArq;S.sel=null;render();window.scrollTo(0,0);}
  else if(a==="arq"){ask("Arquivar este cartão? Ele sai da tela principal e dos totais, mas lançamentos e pagamentos são mantidos.",function(){S.cards.forEach(function(x){if(x.id===id)x.arq=true;});S.sel=null;save();render();window.scrollTo(0,0);},{ok:"Arquivar",title:"Arquivar cartão"});}
  else if(a==="unarq"){S.cards.forEach(function(x){if(x.id===id)x.arq=false;});S.sel=null;S.verArq=S.cards.some(function(x){return x.arq});save();render();}
  else if(a==="due"){var c=S.cards.filter(function(x){return x.id===id})[0];ask("Dia de vencimento do cartão (1 a 31):",function(val){var v=parseInt(val,10);if(v>=1&&v<=31){c.venc=v;save();render();}else msg("Informe um dia entre 1 e 31.");},{input:true,value:c.venc||"",title:"Alterar vencimento",ok:"Salvar"});}
  else if(a==="dele"){ask(delMsg(id)+"\n\n"+txtEntry(S.entries.filter(function(x){return x.id===id})[0])+"\n\nEsta ação não pode ser desfeita.",function(){S.entries=S.entries.filter(function(x){return x.id!==id});save();render();},delOpts(id));}
  else if(a==="delp"){ask("Excluir este pagamento?\n\n"+txtPay(S.payments.filter(function(x){return x.id===id})[0])+"\n\nEsta ação não pode ser desfeita.",function(){S.payments=S.payments.filter(function(x){return x.id!==id});save();render();},{ok:"Excluir"});}
  else if(a==="delcard"){ask("Excluir este cartão e todos os seus lançamentos e pagamentos?\n\n"+txtCard(cardOf(id))+"\n\nEsta ação não pode ser desfeita.",function(){
    S.cards=S.cards.filter(function(x){return x.id!==id});
    S.entries=S.entries.filter(function(x){return x.cardId!==id});
    S.payments=S.payments.filter(function(x){return x.cardId!==id});
    S.sel=null;save();render();},{ok:"Excluir"});}
});

var askYes=null,askMid=null;
function ask(txt,yes,o){o=o||{};
  $("aTit").textContent=o.title||"Atenção";
  $("aTxt").textContent=txt;
  $("aIn").hidden=!o.input;if(o.input)$("aIn").value=o.value||"";
  $("aNo").hidden=!!o.info;$("aMid").hidden=!o.mid;if(o.mid){$("aMid").textContent=o.mid;askMid=o.alt||null;}
  $("aYes").textContent=o.ok||(o.info?"OK":"Confirmar");
  askYes=yes||null;$("dAsk").showModal();if(o.input)$("aIn").focus();
}
function msg(t){ask(t,null,{info:true})}
function cardOf(id){return S.cards.filter(function(x){return x.id===id})[0]}
function mStr(i){return Math.floor(i/12)+"-"+String(i%12+1).padStart(2,"0")}
function entOf(id){return S.entries.filter(function(x){return x.id===id})[0]}
function delMsg(id){var e=entOf(id);return e&&e.qtd>1?"Este lançamento tem "+e.qtd+" parcelas. Excluir somente a parcela de "+mFmt(mIdx(S.mes))+" ou todas as parcelas?":"Excluir este lançamento?"}
function delOpts(id){var e=entOf(id);if(!e||e.qtd<2)return{ok:"Excluir"};
  return{ok:"Todas as parcelas",mid:"Só esta parcela ("+mFmt(mIdx(S.mes))+")",alt:function(){delParcela(id)}};}
function delParcela(id){
  var e=entOf(id);if(!e)return;
  var s=mIdx(e.inicio),k=mIdx(S.mes)-s,q=e.qtd;
  if(k<0||k>=q)return;
  var rest=q-k-1;
  if(k===0){e.inicio=mStr(s+1);e.qtd=rest;}
  else{e.qtd=k;if(rest>0)S.entries.push({id:uid(),cardId:e.cardId,desc:e.desc,valor:e.valor,qtd:rest,inicio:mStr(s+k+1)});}
  if(e.qtd<1)S.entries=S.entries.filter(function(x){return x!==e});
  save();render();
}
function txtEntry(e){if(!e)return "";var c=cardOf(e.cardId),s=mIdx(e.inicio);
  return "Cartão: "+(c?c.nome:"—")+"\nDescrição: "+e.desc+"\nParcela: "+brl.format(e.valor)+" x "+e.qtd+" = "+brl.format(r2(e.valor*e.qtd))+"\nCobrança: "+mFmt(s)+" a "+mFmt(s+e.qtd-1);}
function txtPay(x){if(!x)return "";var c=cardOf(x.cardId);
  return "Cartão: "+(c?c.nome:"—")+"\nValor: "+brl.format(x.valor)+" ("+(x.tipo==="total"?"total":"parcial")+")\nData: "+x.data.split("-").reverse().join("/")+"\nMês de referência: "+mFmt(mIdx(refOf(x)))+(x.obs?"\nObs.: "+x.obs:"");}
function txtCard(c){if(!c)return "";var s=stats(c.id),ne=S.entries.filter(function(e){return e.cardId===c.id}).length,np=S.payments.filter(function(x){return x.cardId===c.id}).length;
  return "Cartão: "+c.nome+(c.final?" (•••• "+c.final+")":"")+(c.venc?"\nVencimento: dia "+c.venc:"")+"\nLançamentos: "+ne+" (total "+brl.format(s.lancado)+")\nPagamentos: "+np+" (total "+brl.format(s.pago)+")\nTotal em aberto: "+brl.format(s.aberto);}
$("aNo").onclick=function(){$("dAsk").close()};
$("aMid").onclick=function(){var f=askMid;$("dAsk").close();if(f)f();};
$("aYes").onclick=function(){var f=askYes,v=$("aIn").value;$("dAsk").close();if(f)f(v);};
$("aIn").onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();$("aYes").click();}};
function shiftM(d){var i=mIdx(S.mes)+d;S.mes=Math.floor(i/12)+"-"+String(i%12+1).padStart(2,"0");render();}
$("mSel").onchange=function(){if($("mSel").value){S.mes=$("mSel").value;render();}};
$("mPrev").onclick=function(){shiftM(-1)};
$("mNext").onclick=function(){shiftM(1)};

var TK="gestao-cartoes-tema",dq=window.matchMedia("(prefers-color-scheme: dark)");
function isDark(){var t=document.documentElement.getAttribute("data-theme");return t?t==="dark":dq.matches}
function paintTheme(){$("bTheme").textContent=isDark()?"☀️ Claro":"🌙 Escuro"}
function setTheme(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem(TK,t)}catch(e){}paintTheme()}
try{var tm=localStorage.getItem(TK);if(tm)document.documentElement.setAttribute("data-theme",tm)}catch(e){}
$("bTheme").onclick=function(){setTheme(isDark()?"light":"dark")};
try{dq.addEventListener("change",paintTheme)}catch(e){}
paintTheme();

load();render();
})();
</script>
</body>
</html>
