<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leitor de preço pela câmera</title>
<style>
  body{font:16px system-ui,sans-serif;max-width:480px;margin:24px auto;padding:0 16px}
  label{display:block;margin:16px 0 4px;font-weight:600}
  input{font-size:18px;padding:8px;width:9em}
  small{color:#666}
</style>
</head>
<body>
  <h1>Leitor de preço</h1>

  <label for="a">Campo numérico (type="number")</label>
  <input id="a" type="number" step="0.01">

  <label for="b">Campo texto, formato brasileiro</label>
  <input id="b" type="text" inputmode="decimal" data-price-scanner>

  <label>Uso programático</label>
  <button id="go">Ler preço</button> <span id="out"></span>

  <p><small>Abra via HTTPS (ou localhost) para a câmera funcionar.</small></p>

  <script src="price-scanner.js"></script>
  <script>
    PriceScanner.attach('#a');                       // adiciona o botão 📷 ao lado do campo
    document.getElementById('go').onclick = async () => {
      const r = await PriceScanner.open({ decimals: 2, max: 9999 });
      document.getElementById('out').textContent = r ? 'R$ ' + r.value.toFixed(2) : 'cancelado';
    };
  </script>
</body>
</html>
